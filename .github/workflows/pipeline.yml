name: hourly-pipeline
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # read/replace the "state" release asset; the job never commits

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: Restore state
        run: |
          if ! gh release download state -p state.tar.gz; then
            echo "Pipeline state is missing. Bootstrap the source tables and upload the state release asset; see docs/SETUP.md."
            exit 1
          fi
          scripts/state.sh unpack

      - name: Fetch, forecast, log, score
        run: uv run python -m pipeline.run_all

      - name: Save state
        run: scripts/state.sh pack && gh release upload state state.tar.gz --clobber

      - name: Export API to static JSON
        run: uv run python -m api.export

      - name: Build site
        run: npm run build
        working-directory: web

      - run: npm run test:unit
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - name: Package live snapshot for Vercel
        run: node scripts/prepare-vercel.mjs

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        id: deploy
        run: |
          scripts/deploy-vercel.sh production > deployment-url.txt
          url="$(tail -n 1 deployment-url.txt)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check deployed site
        env:
          DEPLOY_URL: ${{ vars.OUTLOOK_PUBLIC_URL || steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/check_deployment.py "$DEPLOY_URL" --expected-build web/out/api/build.json
