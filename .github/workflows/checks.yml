name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: outlook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uvx ruff@0.17.2 check api pipeline models scripts tests --select F,E9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: uv run pytest -q tests
      - name: Verify reporting permissions, validation, limits and schema reapplication
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: outlook_test
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests.sql
      - run: uv run python -m api.export
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://reports.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-key
      - run: npm run typecheck
        working-directory: web
      - run: node scripts/prepare-vercel.mjs --allow-unavailable --allow-test-reporting
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          E2E_REPORTS_ENABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
